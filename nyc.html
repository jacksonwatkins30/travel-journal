<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>New York City · Jackson's Travel Log</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Ccircle cx='32' cy='32' r='28' fill='%23E0A93B' stroke='%233B2A1E' stroke-width='5'/%3E%3Cpath d='M42 22l-6 14-14 6 6-14z' fill='%23B8552F' stroke='%233B2A1E' stroke-width='4' stroke-linejoin='round'/%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bowlby+One&family=Nunito:wght@500;700;800;900&family=Caveat:wght@600;700&display=swap">
<style>
:root{--sand:#F2E6CF;--paper:#FBF5E8;--ink:#3B2A1E;--muted:#6B5644;--terra:#B8552F;--olive:#5E6B33;--mustard:#E0A93B;--sky:#9CC3BC;--tan:#E9D8B4;--photo:#D9C9A6;--teal:#2F6F73}
*{box-sizing:border-box;margin:0;padding:0}
html{scroll-behavior:smooth}
body{background:var(--sand);color:var(--ink);font-family:'Nunito',system-ui,sans-serif;-webkit-font-smoothing:antialiased}
a{color:var(--ink)}a:hover{color:var(--terra)}
.wrap{max-width:1200px;margin:0 auto;padding:0 24px}
.display{font-family:'Bowlby One',sans-serif;font-weight:400}
.script{font-family:'Caveat',cursive;font-weight:700;color:var(--terra);font-size:26px}
.card{background:var(--paper);border:3px solid var(--ink);border-radius:22px;box-shadow:6px 6px 0 var(--ink)}
.press{transition:transform .12s ease,box-shadow .12s ease;cursor:pointer}
.press:hover{transform:translate(-2px,-2px);box-shadow:8px 8px 0 var(--ink)}
.press:active{transform:translate(3px,3px);box-shadow:2px 2px 0 var(--ink)}
:focus-visible{outline:3px solid var(--terra);outline-offset:3px}
header.top{border-bottom:3px solid var(--ink);background:var(--paper);position:sticky;top:0;z-index:20}
header.top nav{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:10px;padding-top:12px;padding-bottom:12px}
.brand{display:flex;align-items:center;gap:10px;text-decoration:none;font-size:22px}
.compass{width:44px;height:44px;border-radius:50%;background:var(--mustard);border:3px solid var(--ink);display:flex;align-items:center;justify-content:center}
.links{display:flex;flex-wrap:wrap;gap:2px;font-weight:800;font-size:15px}
.links a{text-decoration:none;padding:10px 12px;border-radius:10px}
.links a:hover,.links a[aria-current]{background:var(--tan);color:var(--ink)}

.hero{position:relative;border-bottom:3px solid var(--ink);background:#E8B07A;overflow:hidden}
.hero svg{display:block;width:100%;height:340px}
.hero-card{position:absolute;top:36px;left:max(24px,calc((100% - 1200px)/2 + 24px));max-width:min(520px,calc(100% - 48px));padding:22px 26px;transform:rotate(-1.5deg)}
.hero-card h1{font-size:clamp(36px,5vw,58px);line-height:1}
.hero-card p{font-size:16px;font-weight:700;color:var(--muted);margin-top:10px}
.win{animation:blink 4s steps(1) infinite}.win2{animation:blink 6s steps(1) -2s infinite}
@keyframes blink{0%,70%{fill:#E0A93B}71%,100%{fill:#3B2A1E}}

.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:18px;padding-top:40px}
.stat{padding:18px 20px;display:flex;flex-direction:column;gap:4px;border-radius:20px}
.stat .lbl{font-size:13px;font-weight:900;letter-spacing:.1em;text-transform:uppercase;color:var(--muted)}
.stat .val{font-size:36px;line-height:1.05}
.stat .sub{font-family:'Caveat',cursive;font-size:21px;font-weight:600;color:var(--muted)}

section.block{padding-top:56px}
.sec-head{display:flex;flex-wrap:wrap;justify-content:space-between;align-items:flex-end;gap:12px;margin-bottom:22px}
.sec-head h2{font-size:clamp(32px,4vw,46px)}
.filters{display:flex;gap:8px;flex-wrap:wrap}
.filter{min-height:44px;padding:0 16px;border:3px solid var(--ink);border-radius:999px;font:inherit;font-size:15px;font-weight:900;box-shadow:4px 4px 0 var(--ink);background:var(--paper);color:var(--ink)}
.filter.on{background:var(--terra);color:var(--paper)}

.list{display:grid;grid-template-columns:repeat(auto-fill,minmax(330px,1fr));gap:26px}
.item{display:flex;flex-direction:column;overflow:hidden}
.item .ph{aspect-ratio:16/10;background:var(--photo);border-bottom:3px solid var(--ink);display:flex;align-items:center;justify-content:center;font-weight:800;color:var(--muted);position:relative;overflow:hidden}
.item .ph img{width:100%;height:100%;object-fit:cover;display:block}
.item .ph button{position:absolute;inset:0;border:0;background:transparent;cursor:zoom-in}
.item .count{position:absolute;right:10px;bottom:10px;background:var(--paper);border:2px solid var(--ink);border-radius:999px;padding:3px 10px;font-size:13px;font-weight:900}
.item .body{padding:18px 20px 22px;display:flex;flex-direction:column;gap:10px}
.item .top{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.pill{font-size:12px;font-weight:900;letter-spacing:.06em;text-transform:uppercase;padding:4px 10px;border-radius:999px;border:2px solid var(--ink);color:var(--paper)}
.item .date{font-size:14px;font-weight:800;color:var(--muted)}
.item h3{font-size:24px;line-height:1.1}
.item .where{font-family:'Caveat',cursive;font-size:22px;font-weight:700;color:var(--terra);line-height:1}
.item p{font-size:16px;font-weight:600;line-height:1.55}
.highlights li{list-style:none;font-size:15px;font-weight:700;margin-top:3px}
.highlights li::before{content:'•';margin-right:8px;color:var(--terra)}
.none{padding:28px;text-align:center;font-weight:800;color:var(--muted)}

.lightbox{position:fixed;inset:0;background:rgba(59,42,30,.92);z-index:50;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;padding:20px}
.lightbox[hidden]{display:none}
.lightbox img{max-width:100%;max-height:78vh;border:4px solid var(--paper);border-radius:8px;object-fit:contain}
.lightbox figcaption{color:var(--paper);font-family:'Caveat',cursive;font-size:26px;text-align:center}
.lb-btns{display:flex;gap:12px}
.lb-btns button{min-height:48px;min-width:48px;padding:0 16px;border:3px solid var(--ink);border-radius:999px;background:var(--paper);font:inherit;font-weight:900;cursor:pointer}
footer{border-top:3px solid var(--ink);background:var(--ink);color:var(--sand);padding:26px 0;margin-top:88px}
footer .wrap{display:flex;flex-wrap:wrap;justify-content:space-between;gap:10px;align-items:center}
@media(max-width:640px){
  header.top{position:static}.links a{padding:8px 10px}
  .hero svg{height:300px}.hero-card{top:22px;padding:18px 20px}
  .list{grid-template-columns:1fr}
}
@media (prefers-reduced-motion: reduce){*{animation:none!important;transition:none!important}html{scroll-behavior:auto}}
</style>
</head>
<body>
<header class="top">
  <nav class="wrap" aria-label="Primary">
    <a href="index.html" class="brand display"><span class="compass"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#3B2A1E" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="9"/><path d="M15.5 8.5l-2 5-5 2 2-5z"/></svg></span>Field Notes</a>
    <div class="links"><a href="states.html">States</a><a href="index.html#trail">The Trail</a><a href="gallery.html">Gallery</a><a href="nyc.html" aria-current="page">New York City</a></div>
  </nav>
</header>

<main>
<section class="hero">
  <svg viewBox="0 0 1200 340" preserveAspectRatio="xMidYMax slice" aria-hidden="true">
    <rect width="1200" height="340" fill="#E8B07A"/>
    <circle cx="1000" cy="110" r="52" fill="#E0A93B" stroke="#3B2A1E" stroke-width="4"/>
    <g stroke="#3B2A1E" stroke-width="4" stroke-linejoin="round" fill="#8A4B2A">
      <path d="M40 340V200h70v140z"/><path d="M120 340V150h60v190z"/><path d="M190 340V230h80v110z"/>
      <path d="M560 340V110l28-24v-30h8v-26h4v26h8v30l28 24v230z" fill="#B8552F"/>
      <path d="M290 340V170h70v170z"/><path d="M370 340V120l40-30 40 30v220z" fill="#5E6B33"/><path d="M460 340V210h90v130z"/>
      <path d="M660 340V160h60v180z"/><path d="M730 340V90h56v250z" fill="#2F6F73"/><path d="M796 340V190h80v150z"/>
      <path d="M886 340V140h64v200z"/><path d="M960 340V220h90v120z"/><path d="M1060 340V170h70v170z"/><path d="M1140 340V240h80v100z"/>
    </g>
    <g fill="#E0A93B">
      <rect class="win" x="134" y="170" width="10" height="14"/><rect class="win2" x="156" y="200" width="10" height="14"/><rect class="win" x="306" y="190" width="10" height="14"/>
      <rect class="win2" x="580" y="140" width="10" height="14"/><rect class="win" x="610" y="190" width="10" height="14"/><rect class="win2" x="744" y="120" width="10" height="14"/>
      <rect class="win" x="764" y="170" width="10" height="14"/><rect class="win2" x="900" y="170" width="10" height="14"/><rect class="win" x="1076" y="200" width="10" height="14"/>
    </g>
    <path d="M-20 340V316H1220V340z" fill="#C9894E" stroke="#3B2A1E" stroke-width="4"/>
  </svg>
  <div class="hero-card card">
    <span class="script">Home base, for now</span>
    <h1 class="display">New York City</h1>
    <p id="heroSub">The fun, the weird, and the unforgettable from a year in the city.</p>
  </div>
</section>

<div class="wrap stats" id="stats"></div>

<section class="wrap block">
  <div class="sec-head"><div><span class="script">Only in New York</span><h2 class="display">The Log</h2></div><div class="filters" role="group" aria-label="Filter by category" id="filters"></div></div>
  <div class="list" id="list"></div>
</section>
</main>

<div class="lightbox" id="lb" hidden role="dialog" aria-modal="true" aria-label="Photo viewer">
  <figure style="display:flex;flex-direction:column;align-items:center;gap:12px"><img id="lbImg" alt=""><figcaption id="lbCap"></figcaption></figure>
  <div class="lb-btns"><button type="button" onclick="step(-1)" aria-label="Previous photo">←</button><button type="button" onclick="closeLb()">Close</button><button type="button" onclick="step(1)" aria-label="Next photo">→</button></div>
</div>

<footer><div class="wrap"><span class="display" style="font-size:18px">Jackson's Travel Log</span><span style="font-family:'Caveat',cursive;font-size:22px;font-weight:600">If you can make it here, you can make it in Dallas.</span></div></footer>

<script>
const esc = s => String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const INKS={'Sports':'#B8552F','Eats & Drinks':'#8A4B2A','Runs':'#5E6B33','Culture':'#2F6F73','Nights Out':'#7A3E5A','Only in NYC':'#6B5A2A'};
const ink = c => INKS[c] || '#3B2A1E';
let ITEMS=[], cat='All', cur=[], idx=0;

function renderStats(){
  const cats=new Set(ITEMS.map(i=>i.category).filter(Boolean));
  const photos=ITEMS.reduce((n,i)=>n+(i.photos||[]).length,0);
  const counts={}; ITEMS.forEach(i=>counts[i.category]=(counts[i.category]||0)+1);
  const top=Object.entries(counts).sort((a,b)=>b[1]-a[1])[0];
  const cards=[['Adventures logged',ITEMS.length,'and counting'],['Categories',cats.size,'something for everyone'],['Photos',photos||'—','worth a thousand words'],['Most common',top?top[0]:'—',top?top[1]+' entr'+(top[1]===1?'y':'ies'):'']];
  document.getElementById('stats').innerHTML=cards.map((c,i)=>`<div class="card stat" style="transform:rotate(${[-1,1,-.5,1.2][i]}deg)"><span class="lbl">${c[0]}</span><span class="val display">${esc(c[1])}</span><span class="sub">${esc(c[2])}</span></div>`).join('');
}
function renderFilters(){
  const cats=['All',...new Set(ITEMS.map(i=>i.category).filter(Boolean))];
  document.getElementById('filters').innerHTML=cats.map(c=>`<button type="button" class="filter press${c===cat?' on':''}" aria-pressed="${c===cat}" onclick="setCat(this.dataset.c)" data-c="${esc(c)}">${esc(c)}</button>`).join('');
}
function renderList(){
  const list=ITEMS.filter(i=>cat==='All'||i.category===cat);
  document.getElementById('list').innerHTML=list.map(i=>{const ps=i.photos||[],p=ps[0];
    return `<article class="card item"><div class="ph">${p?`<img src="${esc(p.src||p)}" alt="${esc(p.caption||i.title)}" loading="lazy"><button type="button" onclick="openLb('${esc(i.id)}')" aria-label="Open photos for ${esc(i.title)}"></button>${ps.length>1?`<span class="count">${ps.length} photos</span>`:''}`:'[Photo]'}</div>
    <div class="body"><div class="top"><span class="pill" style="background:${ink(i.category)}">${esc(i.category||'NYC')}</span><span class="date">${esc(i.when)}</span></div>
    <h3 class="display">${esc(i.title)}</h3>${i.where?`<span class="where">${esc(i.where)}</span>`:''}<p>${esc(i.blurb)}</p>
    ${(i.highlights&&i.highlights.length)?`<ul class="highlights">${i.highlights.map(h=>`<li>${esc(h)}</li>`).join('')}</ul>`:''}</div></article>`;}).join('') || '<div class="card none">Nothing here yet.</div>';
}
function setCat(c){cat=c;renderFilters();renderList();}
function openLb(id){const it=ITEMS.find(x=>x.id===id);cur=(it.photos||[]).map(p=>({src:p.src||p,cap:p.caption||it.title}));idx=0;show();document.getElementById('lb').hidden=false;}
function show(){const im=document.getElementById('lbImg');im.src=cur[idx].src;im.alt=cur[idx].cap;document.getElementById('lbCap').textContent=cur[idx].cap;}
function step(d){idx=(idx+d+cur.length)%cur.length;show();}
function closeLb(){document.getElementById('lb').hidden=true;}
document.addEventListener('keydown',e=>{if(document.getElementById('lb').hidden)return;if(e.key==='Escape')closeLb();if(e.key==='ArrowLeft')step(-1);if(e.key==='ArrowRight')step(1);});
document.getElementById('lb').addEventListener('click',e=>{if(e.target.id==='lb')closeLb();});

fetch('data/nyc.json',{cache:'no-cache'}).then(r=>r.json()).then(d=>{
  ITEMS=d.sort((a,b)=>(a.date||'')<(b.date||'')?-1:1);
  renderStats();renderFilters();renderList();
});
</script>
</body>
</html>
