<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>States · Field Notes</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Ccircle cx='32' cy='32' r='28' fill='%23E0A93B' stroke='%233B2A1E' stroke-width='5'/%3E%3Cpath d='M42 22l-6 14-14 6 6-14z' fill='%23B8552F' stroke='%233B2A1E' stroke-width='4' stroke-linejoin='round'/%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bowlby+One&family=Nunito:wght@500;700;800;900&family=Caveat:wght@600;700&display=swap">
<style>
:root{--sand:#F2E6CF;--paper:#FBF5E8;--ink:#3B2A1E;--muted:#6B5644;--terra:#B8552F;--olive:#5E6B33;--mustard:#E0A93B;--tan:#E9D8B4}
*{box-sizing:border-box;margin:0;padding:0}
body{background:var(--sand);color:var(--ink);font-family:'Nunito',system-ui,sans-serif;-webkit-font-smoothing:antialiased}
a{color:var(--ink)}a:hover{color:var(--terra)}
.wrap{max-width:1200px;margin:0 auto;padding:0 24px}
.display{font-family:'Bowlby One',sans-serif;font-weight:400}
.script{font-family:'Caveat',cursive;font-weight:700;color:var(--terra);font-size:26px}
.card{background:var(--paper);border:3px solid var(--ink);border-radius:22px;box-shadow:6px 6px 0 var(--ink)}
.press{transition:transform .12s ease,box-shadow .12s ease;cursor:pointer}
.press:hover{transform:translate(-2px,-2px);box-shadow:8px 8px 0 var(--ink)}
.press:active{transform:translate(3px,3px);box-shadow:2px 2px 0 var(--ink)}
button:focus-visible,a:focus-visible{outline:3px solid var(--terra);outline-offset:3px}
header.top{border-bottom:3px solid var(--ink);background:var(--paper)}
header.top nav{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:10px;padding-top:12px;padding-bottom:12px}
.brand{display:flex;align-items:center;gap:10px;text-decoration:none;font-size:22px}
.compass{width:44px;height:44px;border-radius:50%;background:var(--mustard);border:3px solid var(--ink);display:flex;align-items:center;justify-content:center}
.links{display:flex;flex-wrap:wrap;gap:2px;font-weight:800;font-size:15px}
.links a{text-decoration:none;padding:10px 12px;border-radius:10px}
.links a:hover,.links a[aria-current]{background:var(--tan);color:var(--ink)}
.head{display:flex;flex-wrap:wrap;justify-content:space-between;align-items:flex-end;gap:16px;padding-top:40px;margin-bottom:22px}
.head h1{font-size:clamp(36px,5vw,56px);line-height:1}
.count{display:flex;align-items:baseline;gap:10px;padding:14px 20px;transform:rotate(1.2deg)}
.count .display{font-size:52px;line-height:1}
.count span:last-child{font-weight:800;color:var(--muted)}
.stage{position:relative;overflow:hidden;padding:0}
#scene{display:block;width:100%;height:min(68vh,620px);touch-action:none;cursor:grab}
#scene:active{cursor:grabbing}
#flat{display:none;width:100%;height:auto;padding:16px}
#flat .st{fill:var(--paper);stroke:var(--ink);stroke-width:1.2;cursor:pointer}
#flat .st.on{fill:var(--mustard)}
#flat .st:hover{fill:var(--tan)}#flat .st.on:hover{fill:#D59A2A}
.overlay{position:absolute;left:14px;right:14px;top:14px;display:flex;flex-wrap:wrap;justify-content:space-between;gap:10px;pointer-events:none;z-index:2}
.overlay>*{pointer-events:auto}
.legend{display:flex;align-items:center;gap:8px;background:var(--paper);border:2px solid var(--ink);border-radius:999px;padding:6px 12px;font-size:13px;font-weight:800}
.legend i{width:14px;height:14px;border-radius:4px;border:2px solid var(--ink);background:var(--mustard)}
.tools{display:flex;gap:8px;flex-wrap:wrap}
.tool{min-height:44px;padding:0 14px;border:3px solid var(--ink);border-radius:999px;background:var(--paper);color:var(--ink);font:inherit;font-weight:900;font-size:14px;box-shadow:3px 3px 0 var(--ink)}
.tool.on{background:var(--ink);color:var(--paper)}
.hint{position:absolute;left:50%;bottom:12px;transform:translateX(-50%);font-size:13px;font-weight:800;color:var(--muted);background:rgba(251,245,232,.9);border:2px solid var(--ink);border-radius:999px;padding:5px 12px;white-space:nowrap;z-index:2;transition:opacity .4s}
.tip{position:absolute;z-index:3;pointer-events:none;background:var(--ink);color:var(--paper);font-weight:800;font-size:13px;padding:5px 10px;border-radius:8px;transform:translate(-50%,-140%);white-space:nowrap;opacity:0;transition:opacity .12s}
.info{margin-top:18px;min-height:64px;display:flex;flex-wrap:wrap;align-items:center;gap:10px 14px;padding:14px 18px;border:2px dashed var(--ink);border-radius:16px;background:var(--paper);font-weight:700}
.info b{font-family:'Bowlby One',sans-serif;font-weight:400;font-size:22px}
.tag{font-size:12px;font-weight:900;letter-spacing:.06em;text-transform:uppercase;padding:4px 10px;border-radius:999px;border:2px solid var(--ink)}
.tag.y{background:var(--mustard)}.tag.n{background:var(--sand)}
.info a.trip{display:inline-flex;align-items:center;min-height:40px;padding:0 14px;border:3px solid var(--ink);border-radius:999px;background:var(--sand);text-decoration:none;font-weight:900;box-shadow:3px 3px 0 var(--ink)}
.local-bar{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:10px;margin-top:14px;padding:12px 16px;border:3px solid var(--ink);border-radius:14px;background:#FFF3D6;font-weight:700;font-size:14px}
.local-bar[hidden]{display:none}
.local-bar button{min-height:40px;padding:0 14px;border:3px solid var(--ink);border-radius:999px;background:var(--paper);font:inherit;font-weight:900;cursor:pointer}
.chips{display:flex;flex-wrap:wrap;gap:8px;margin-top:26px}
.chip{font-size:13px;font-weight:900;padding:6px 12px;border-radius:999px;border:2px solid var(--ink);background:var(--mustard);box-shadow:2px 2px 0 var(--ink);cursor:pointer;font-family:inherit;transition:transform .15s cubic-bezier(.3,1.6,.5,1)}
.chip:hover{transform:translateY(-3px) rotate(-2deg)}
footer{border-top:3px solid var(--ink);background:var(--ink);color:var(--sand);padding:26px 0;margin-top:72px}
footer .wrap{display:flex;flex-wrap:wrap;justify-content:space-between;gap:10px;align-items:center;font-size:13px}
@media(max-width:640px){#scene{height:400px}.count .display{font-size:40px}.hint{font-size:12px}}
@media (prefers-reduced-motion: reduce){*{transition:none!important}}
</style>
<script type="importmap">{"imports":{"three":"https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js","three/addons/":"https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"}}</script>
</head>
<body>
<header class="top">
  <nav class="wrap" aria-label="Primary">
    <a href="index.html" class="brand display"><span class="compass"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#3B2A1E" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="9"/><path d="M15.5 8.5l-2 5-5 2 2-5z"/></svg></span>Field Notes</a>
    <div class="links"><a href="states.html" aria-current="page">States</a><a href="index.html#trail">The Trail</a><a href="index.html#passport">Passport</a><a href="index.html#snapshots">Snapshots</a><a href="index.html#bucket">Bucket List</a></div>
  </nav>
</header>

<main class="wrap">
  <div class="head">
    <div><span class="script">Pins on the map</span><h1 class="display">States I've Been</h1></div>
    <div class="card count" aria-live="polite"><span class="display" id="stateCount">0</span><span>of 50 states</span></div>
  </div>

  <div class="card stage">
    <canvas id="scene" aria-label="3D map of the United States. Visited states are raised and lit up. Drag to spin, pinch or scroll to zoom." role="img"></canvas>
    <svg id="flat" viewBox="0 0 975 610" role="group" aria-label="Map of US states. Visited states are lit up."><g id="flatLayer"></g></svg>
    <div class="overlay">
      <div class="legend"><i></i>Been there</div>
      <div class="tools">
        <button type="button" class="tool press" id="viewBtn" onclick="window.toggleView()">Flat view</button>
        <button type="button" class="tool press" id="editBtn" aria-pressed="false" onclick="window.toggleEdit()">Edit map</button>
      </div>
    </div>
    <div class="tip" id="tip"></div>
    <div class="hint" id="hint">Drag to spin · scroll or pinch to zoom · tap a state</div>
  </div>

  <div class="info" id="info" aria-live="polite">Tap a state to see trips there.</div>
  <div class="local-bar" id="localBar" role="status" hidden><span id="localMsg"></span><span style="display:flex;gap:8px;flex-wrap:wrap"><button type="button" onclick="window.copyStates()">Copy my list</button><button type="button" onclick="window.resetStates()">Undo my changes</button></span></div>

  <div class="chips" id="chips" aria-label="Visited states"></div>
</main>

<footer><div class="wrap"><span class="display" style="font-size:18px">Field Notes</span><span>State boundaries: US Census Bureau</span></div></footer>

<script>
// shared state + 2D fallback (plain script so it works even without WebGL)
const esc = s => String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
window.FN = {US:null, TRIPS:[], BASE:[], names:{}, edit:false, picked:null, listeners:[]};
function localStates(){try{const v=localStorage.getItem('fieldnotes-states');return v?JSON.parse(v):null;}catch(e){return null;}}
function visitedSet(){return new Set(localStates()||FN.BASE);}
function visitedCount(){return [...visitedSet()].filter(s=>s!=='DC').length;}
function tripYear(t){return +(t.year||(t.start||t.sort||'').slice(0,4))||'';}
function refreshUI(){
  const v=visitedSet();
  document.getElementById('stateCount').textContent=visitedCount();
  document.getElementById('chips').innerHTML=[...v].filter(id=>FN.names[id]).sort((a,b)=>FN.names[a]<FN.names[b]?-1:1).map(id=>`<button type="button" class="chip" onclick="selectState('${id}')">${esc(FN.names[id])}</button>`).join('');
  document.querySelectorAll('#flatLayer .st').forEach(el=>{const on=v.has(el.dataset.id);el.classList.toggle('on',on);el.setAttribute('aria-pressed',on);});
  const local=localStates(), bar=document.getElementById('localBar');
  if(local){const add=local.filter(s=>!FN.BASE.includes(s)).length, rem=FN.BASE.filter(s=>!local.includes(s)).length;
    bar.hidden=!(add||rem); document.getElementById('localMsg').textContent=`Your changes (${add} added${rem?', '+rem+' removed':''}) are saved on this device only. Copy your list and send it to Claude to make them permanent.`;}
  else bar.hidden=true;
  FN.listeners.forEach(fn=>fn(v));
}
function selectState(id){
  FN.picked=id;
  if(FN.edit){
    const v=visitedSet(); v.has(id)?v.delete(id):v.add(id);
    const arr=[...v].sort(), base=[...FN.BASE].sort();
    const same=arr.length===base.length&&arr.every((s,i)=>s===base[i]);
    try{same?localStorage.removeItem('fieldnotes-states'):localStorage.setItem('fieldnotes-states',JSON.stringify(arr));}catch(e){}
  }
  refreshUI();
  const on=visitedSet().has(id), trips=FN.TRIPS.filter(t=>(t.states||[]).includes(id));
  let h=`<b>${esc(FN.names[id])}</b><span class="tag ${on?'y':'n'}">${on?'Been there':'Not yet'}</span>`;
  h+=trips.length?trips.map(t=>`<a class="trip" href="index.html?trip=${encodeURIComponent(t.id)}#trail">${esc(t.title)} · ${tripYear(t)}</a>`).join(''):`<span style="color:var(--muted)">${FN.edit?(on?'Lit up! Tap again to turn it off.':'Tap again to light it up.'):'No trips logged here yet.'}</span>`;
  document.getElementById('info').innerHTML=h;
}
window.toggleEdit=function(){
  FN.edit=!FN.edit; const b=document.getElementById('editBtn');
  b.classList.toggle('on',FN.edit); b.setAttribute('aria-pressed',FN.edit); b.textContent=FN.edit?'Done editing':'Edit map';
  document.getElementById('info').textContent=FN.edit?"Tap states to light up where you've been.":'Tap a state to see trips there.';
};
window.copyStates=function(){
  const list=[...visitedSet()].sort().join(', '), msg=document.getElementById('localMsg');
  const done=()=>{msg.textContent='Copied: '+list;};
  navigator.clipboard?navigator.clipboard.writeText(list).then(done,()=>{msg.textContent=list;}):(msg.textContent=list);
};
window.resetStates=function(){try{localStorage.removeItem('fieldnotes-states');}catch(e){} refreshUI();};
let flatMode=false;
window.toggleView=function(){
  flatMode=!flatMode;
  if(FN.has3d){ FN.setFlat(flatMode); }
  document.getElementById('viewBtn').textContent=flatMode?'3D view':'Flat view';
};
function useFlatFallback(){
  document.getElementById('scene').style.display='none'; document.getElementById('flat').style.display='block';
  document.getElementById('hint').style.display='none'; document.getElementById('viewBtn').style.display='none';
}
const ready = Promise.all(['data/us-states.json','data/visited.json','data/trips.json'].map(u=>fetch(u,{cache:'no-cache'}).then(r=>r.json()))).then(([us,vis,trips])=>{
  FN.US=us; FN.BASE=vis.visited||[]; FN.TRIPS=trips; us.states.forEach(s=>FN.names[s.id]=s.name);
  const layer=document.getElementById('flatLayer');
  layer.innerHTML=us.states.map(s=>`<path class="st" d="${s.d}" data-id="${s.id}" tabindex="0" role="button" aria-label="${esc(s.name)}"><title>${esc(s.name)}</title></path>`).join('');
  layer.addEventListener('click',e=>{const el=e.target.closest('.st'); if(el) selectState(el.dataset.id);});
  layer.addEventListener('keydown',e=>{if((e.key==='Enter'||e.key===' ')&&e.target.classList.contains('st')){e.preventDefault();selectState(e.target.dataset.id);}});
  refreshUI();
});
window.FN.ready=ready;
</script>
<script type="module">
let THREE, OrbitControls;
try{ THREE = await import('three'); ({OrbitControls} = await import('three/addons/controls/OrbitControls.js')); }
catch(e){ console.error(e); }
await FN.ready;
const canvas=document.getElementById('scene');
let renderer=null;
try{ if(THREE) renderer=new THREE.WebGLRenderer({canvas,antialias:true}); }catch(e){ console.error(e); }
if(!renderer){ useFlatFallback(); }
else{
  FN.has3d=true;
  const REDUCED=window.matchMedia('(prefers-reduced-motion: reduce)').matches;
  renderer.setPixelRatio(Math.min(2,window.devicePixelRatio||1));
  renderer.shadowMap.enabled=true; renderer.shadowMap.type=THREE.PCFSoftShadowMap;
  const scene=new THREE.Scene(); scene.background=new THREE.Color('#E9D8B4');
  const camera=new THREE.PerspectiveCamera(32,1,1,6000); camera.up.set(0,0,1);
  const controls=new OrbitControls(camera,canvas);
  controls.enableDamping=true; controls.enablePan=false; controls.minDistance=400; controls.maxDistance=4800;
  controls.maxPolarAngle=1.25; controls.rotateSpeed=.6;

  scene.add(new THREE.HemisphereLight('#FFF7E6','#8A6A4A',1.6));
  const sun=new THREE.DirectionalLight('#FFFFFF',2.2); sun.position.set(-400,-600,900); sun.castShadow=true;
  sun.shadow.mapSize.set(2048,2048); Object.assign(sun.shadow.camera,{left:-600,right:600,top:450,bottom:-450,near:10,far:2500});
  scene.add(sun);
  // table under the map
  const table=new THREE.Mesh(new THREE.PlaneGeometry(4000,4000),new THREE.MeshToonMaterial({color:'#E9D8B4'}));
  table.position.z=-1; table.receiveShadow=true; scene.add(table);

  const BASE_H=6, VISIT_H=26, HOVER_H=10;
  const lineMat=new THREE.LineBasicMaterial({color:'#3B2A1E'});
  const C_OFF=new THREE.Color('#FBF5E8'), C_ON=new THREE.Color('#E0A93B'), C_HOVER=new THREE.Color('#E9D8B4'), C_ONHOVER=new THREE.Color('#D59A2A');
  const states=[]; const byId={};
  function parse(d){return d.split('M').filter(Boolean).map(r=>r.replace('Z','').split('L').map(p=>{const [x,y]=p.split(',').map(Number);return new THREE.Vector2(x-487.5,-(y-305));}));}
  FN.US.states.forEach(s=>{
    const shapes=parse(s.d).filter(r=>r.length>2).map(r=>new THREE.Shape(r));
    const geom=new THREE.ExtrudeGeometry(shapes,{depth:1,bevelEnabled:false,curveSegments:1});
    const mat=new THREE.MeshToonMaterial({color:C_OFF.clone()});
    const mesh=new THREE.Mesh(geom,mat); mesh.castShadow=true; mesh.receiveShadow=true;
    mesh.add(new THREE.LineSegments(new THREE.EdgesGeometry(geom,40),lineMat));
    mesh.userData={id:s.id,h:BASE_H,target:BASE_H,on:false,hover:false};
    mesh.scale.z=BASE_H; scene.add(mesh); states.push(mesh); byId[s.id]=mesh;
  });
  function paint(v){
    states.forEach(m=>{
      const on=v.has(m.userData.id), was=m.userData.on; m.userData.on=on;
      m.userData.target=on?VISIT_H:BASE_H;
      if(on&&!was&&FN._painted&&!REDUCED){ m.userData.h=BASE_H; m.userData.bounce=1; }
      tint(m);
    });
    FN._painted=true;
  }
  function tint(m){const u=m.userData; m.material.color.copy(u.on?(u.hover?C_ONHOVER:C_ON):(u.hover?C_HOVER:C_OFF));}
  FN.listeners.push(paint); paint(new Set(visitedSet()));

  // camera presets
  const VIEW3D={pos:new THREE.Vector3(0,-1050,780)}, VIEWFLAT={pos:new THREE.Vector3(0,-1,1250)};
  let camGoal=null;
  function fit(){
    const w=canvas.clientWidth, h=canvas.clientHeight; renderer.setSize(w,h,false); camera.aspect=w/h; camera.updateProjectionMatrix();
    const k=Math.max(1,1.5/camera.aspect); VIEW3D.pos.set(0,-1050*k,780*k); VIEWFLAT.pos.set(0,-1,1250*k);
  }
  fit(); camera.position.copy(VIEW3D.pos); controls.update();
  window.addEventListener('resize',()=>{fit();});
  FN.setFlat=f=>{camGoal=(f?VIEWFLAT:VIEW3D).pos.clone();};

  // picking
  const ray=new THREE.Raycaster(), ptr=new THREE.Vector2(); let hovered=null, down=null;
  const tip=document.getElementById('tip'), hint=document.getElementById('hint');
  function pickAt(e){
    const r=canvas.getBoundingClientRect(); ptr.set(((e.clientX-r.left)/r.width)*2-1, -((e.clientY-r.top)/r.height)*2+1);
    ray.setFromCamera(ptr,camera); const hit=ray.intersectObjects(states,false)[0]; return hit?hit.object:null;
  }
  canvas.addEventListener('pointermove',e=>{
    if(e.pointerType!=='mouse') return;
    const m=pickAt(e);
    if(hovered!==m){ if(hovered){hovered.userData.hover=false;tint(hovered);} hovered=m; if(m){m.userData.hover=true;tint(m);} }
    if(m){const r=canvas.getBoundingClientRect(); tip.style.left=(e.clientX-r.left)+'px'; tip.style.top=(e.clientY-r.top)+'px'; tip.textContent=FN.names[m.userData.id]+(m.userData.on?' ✓':''); tip.style.opacity=1; canvas.style.cursor='pointer';}
    else {tip.style.opacity=0; canvas.style.cursor='';}
  });
  canvas.addEventListener('pointerleave',()=>{tip.style.opacity=0; if(hovered){hovered.userData.hover=false;tint(hovered);hovered=null;}});
  canvas.addEventListener('pointerdown',e=>{down={x:e.clientX,y:e.clientY}; hint.style.opacity=0; idle=false;});
  canvas.addEventListener('pointerup',e=>{
    if(!down) return; const moved=Math.hypot(e.clientX-down.x,e.clientY-down.y); down=null;
    if(moved>6) return; const m=pickAt(e); if(m){ m.userData.bounce=1; selectState(m.userData.id); }
  });

  // loop
  let idle=!REDUCED, t0=performance.now();
  controls.addEventListener('start',()=>{idle=false; camGoal=null;});
  function frame(t){
    const dt=Math.min(.05,(t-t0)/1000); t0=t;
    states.forEach(m=>{
      const u=m.userData; let goal=u.target+(u.hover?HOVER_H:0);
      if(u.bounce){ goal+=18*u.bounce; u.bounce=Math.max(0,u.bounce-dt*2.4); }
      u.h+= (goal-u.h)*Math.min(1,dt*(REDUCED?60:9)); m.scale.z=Math.max(.5,u.h);
    });
    if(camGoal){ camera.position.lerp(camGoal,Math.min(1,dt*4)); if(camera.position.distanceTo(camGoal)<1) camGoal=null; }
    else if(idle){ const a=Math.sin(t/5200)*.12, R=Math.hypot(VIEW3D.pos.x,VIEW3D.pos.y); camera.position.set(Math.sin(a)*R, -Math.cos(a)*R, VIEW3D.pos.z); }
    controls.update(); renderer.render(scene,camera); requestAnimationFrame(frame);
  }
  requestAnimationFrame(frame);
}
</script>
</body>
</html>
