name: Map update

# Fired by the "Publish to site" button on states.html, which opens a pre-filled issue.
# Only issues opened by the repo owner are applied.
on:
  issues:
    types: [opened]

permissions:
  contents: write
  issues: write

concurrency:
  group: map-update
  cancel-in-progress: false

jobs:
  apply:
    if: startsWith(github.event.issue.title, 'Map update') && github.event.issue.user.login == github.repository_owner
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Update visited states
        id: apply
        env:
          ISSUE_BODY: ${{ github.event.issue.body }}
        run: python3 scripts/apply_map_update.py
      - name: Commit
        run: |
          git add data/visited.json
          if git diff --cached --quiet; then echo "Nothing changed."; exit 0; fi
          git config user.name "field-notes-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Map update from issue #${{ github.event.issue.number }}"
          git push
      - name: Close the issue
        if: always()
        uses: actions/github-script@v7
        env:
          SUMMARY: ${{ steps.apply.outputs.summary }}
          OUTCOME: ${{ job.status }}
        with:
          script: |
            const ok = process.env.OUTCOME === 'success';
            const body = ok
              ? `Done: ${process.env.SUMMARY}. The map updates for everyone within a minute or two.`
              : `This update couldn't be applied. See the run: ${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;
            await github.rest.issues.createComment({owner: context.repo.owner, repo: context.repo.repo, issue_number: context.issue.number, body});
            if (ok) await github.rest.issues.update({owner: context.repo.owner, repo: context.repo.repo, issue_number: context.issue.number, state: 'closed'});
